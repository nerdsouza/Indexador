name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instala dependências de desenvolvimento
        run: pip install -r requirements-dev.txt
      - name: Testes do motor de busca
        run: python -m pytest -q
